<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏品来源与返还审查</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}select,button,input{padding:8px;margin:4px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin-bottom:12px}</style></head>
<body><h1>藏品来源与返还审查</h1>
<div class="panel"><select id="user"><option>staff</option><option>reviewer1</option><option>reviewer2</option><option>reviewer3</option><option>claimant1</option><option>claimant2</option><option>public</option></select><button onclick="load()">查看当前角色可见藏品</button></div>
<div class="panel"><input id="cid" type="number" min="1" placeholder="共同审理案 ID" style="width:9em"><button onclick="loadCase()">查看共同审理（按角色分层）</button></div>
<pre id="out"></pre>
<script>
async function load(){const r=await fetch("/api/objects",{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}
async function loadCase(){const r=await fetch("/api/joint-cases/"+cid.value,{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
